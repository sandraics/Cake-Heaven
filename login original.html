<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Login - Cake Heaven</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- Google Font for Logo -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-image: url("loginimg.jpg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }

    .logo {
    margin-left:20px;
      margin-top: 20px;
    }


    .logo i {
      font-size: 2.5rem;
      color:chocolate;
      margin-right: 10px;
    }

    .form-container {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid white;
      width: 90%;
      max-width: 500px;
      margin: 60px auto;
      padding: 30px 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      margin-top:100px;
    }

    h2 {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    .input-container {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 15px;
    }

    .icon {
      padding: 10px;
      background: chocolate;
      color: white;
      min-width: 50px;
      text-align: center;
      border-radius: 5px 0 0 5px;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      outline: none;
      border: none;
      border-radius: 0 5px 5px 0;
    }

    .input-field:focus {
      border: 2px solid dodgerblue;
    }

    .btn, .btn1 {
      width: 100%;
      padding: 15px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      border-radius: 5px;
      font-size: 1rem;
    }

    .btn {
      background-color: chocolate;
      color: white;
    }

    .btn:hover {
      opacity: 1;
      background-color: #a0522d;
    }

    label {
      color: white;
      font-size: 0.95rem;
    }

    .footer-links {
      text-align: center;
      margin-top: 15px;
      font-size: 0.95rem;
    }

    .footer-links a {
      color: white;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .logo a {
        font-size: 2rem;
      }

      .form-container {
        padding: 20px 15px;
        margin: 40px auto;
      }

      .logo i {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

  <div class="logo">
    <a href="index.html">
      <i class="fas fa-cheese"></i>
    </a>
  </div>

  <div class="form-container">
    <form action="/action_page.php">
      <h2>Login Form</h2>

      <div class="input-container">
        <i class="fa fa-user icon"></i>
        <input class="input-field" type="text" placeholder="Username" name="usrnm" required>
      </div>

      <div class="input-container">
        <i class="fa fa-key icon"></i>
        <input class="input-field" type="password" placeholder="Password" name="psw" required>
      </div>

      <label>
        <input type="checkbox" name="rem"> Remember me
      </label>

      <div class="footer-links">
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="btn">Login</button>

      <div class="footer-links">
        Don't have an account? <a href="sign up.html">Register</a>
      </div>
    </form>
  </div>

</body>
</html>
