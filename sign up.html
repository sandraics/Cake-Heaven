<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Cake Heaven</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
       font-family: 'Dancing Script', cursive;
      margin: 0;
      padding: 0;
      background-image: url("signup img.jpg");
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .logo {
      display: flex;
      flex-direction: column;
    margin-left:20px;
      margin-top: 10px;
    }

    .logo i {
      font-size: 40px;
      color: chocolate;
    }

    

    .main {
      max-width: 400px;
      margin: 80px auto;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.8);
      border: 1px solid #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: chocolate;
      margin-bottom: 20px;
    }

    input[type=text],
    input[type=password] {
      width: 100%;
      padding: 15px;
      margin: 5px 0 20px 0;
      border: none;
      background: #f1f1f1;
      border-radius: 5px;
    }

    input[type=text]:focus,
    input[type=password]:focus {
      background-color: #ddd;
      outline: none;
    }

    label {
      color: #333;
      font-weight: bold;
    }

    button {
      background-color: white;
      color: chocolate;
      padding: 14px 20px;
      margin-top: 10px;
      border: 1px solid chocolate;
      cursor: pointer;
      width: 100%;
      border-radius: 5px;
      font-weight: bold;
    }

    button:hover {
      background-color: chocolate;
      color: white;
    }

    .cancelbtn {
      background-color: chocolate;
      color: white;
    }

    .container {
      padding: 16px 0;
      width:380px;
    }

    .terms {
      font-size: 14px;
      color: #333;
    }

    .terms a {
      color: dodgerblue;
    }

    @media (max-width: 600px) {
      .main {
        width: 90%;
        margin: 40px auto;
      }

      .logo a {
        font-size: 24px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="logo">
    <a href="index.html"><i class="fas fa-cheese"></i></a>
   
  </div>

  <div class="main">
    <h1>Sign Up</h1>
    <form action="/action_page.php">
      <div class="container">
        <label for="email">Email</label>
        <input type="text" placeholder="Enter Email" name="email" required>

        <label for="psw">Password</label>
        <input type="password" placeholder="Enter Password" name="psw" required>

        <label for="psw-repeat">Repeat Password</label>
        <input type="password" placeholder="Repeat Password" name="psw-repeat" required>

        <label>
          <input type="checkbox" checked="checked" name="remember"> Remember me
        </label>

        <p class="terms">By creating an account you agree to our <a href="#">Terms & Privacy</a>.</p>

        <button type="submit">Sign Up</button>
        <a href="login original.html"><button type="button" class="cancelbtn">Cancel</button></a>
      </div>
    </form>
  </div>

</body>
</html>
