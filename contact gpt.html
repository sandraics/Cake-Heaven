<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url(contactimage.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Arial, sans-serif;
        }

        .logo {
           
            padding: 20px;
         color: chocolate;
     font-size: 50px;
           }

      
        .logo a {
            font-family: 'Dancing Script', cursive;
            font-size: 40px;
            color: chocolate;
            text-decoration: none;
        }

        h2 {
            text-align: center;
            color: white;
            font-size: 48px;
            margin-top: 20px;
            font-family:'Dancing Script', cursive;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid whitesmoke;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
        }

        .contact {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 50px;
            padding: 10px 20px;
            margin: 20px 0;
            transition: box-shadow 0.3s ease;
        }

        .contact:hover {
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
        }

        .contact img {
            width: 40px;
            height: 40px;
            margin-right: 20px;
        }

        .contact p {
            margin: 0;
            color: chocolate;
            font-size: 18px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h2 {
                font-size: 36px;
            }

            .container {
                margin: 20px;
                padding: 10px;
            }

            .contact {
                flex-direction: column;
                align-items: flex-start;
                border-radius: 10px;
            }

            .contact img {
                margin: 0 0 10px 0;
            }

            .contact p {
                font-size: 16px;
            }

            .logo {
                flex-direction: column;

            
            }

            .logo i {
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="logo" ><a href="index.html">
        <i class="fas fa-cheese"></i></a>
      
    </div>

    <h2>Contact Us</h2>

    <div class="container">
        <div class="contact">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvU20KrOt-BrGTJh9dYuq2Lo2mhsc7KQ4Niw&s" alt="Phone Icon">
            <p>568-5226-1200 (Toll Free)</p>
        </div>

        <div class="contact">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRoGNKMgTSchHl5Rl8PWIx1HSlyNZXzK9j1hw&s" alt="Email Icon">
            <p>sweetcake@gmail.com</p>
        </div>

        <div class="contact">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQD4TNbOB8q3CmmiWrPcXSBgvRnLLfrbd_tJQ&s" alt="Location Icon">
            <p>123 Anywhere St., Any City</p>
        </div>
    </div>

</body>
</html>
